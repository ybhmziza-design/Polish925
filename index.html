<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SILVER PLUG KENYA — 925 Sterling Silver Jewelry</title>
  <link rel="icon" type="image/jpeg" href="/assets/logo_sp_square.jpg" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Playfair Display', 'serif'],
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            amber: {
              50: '#fffbeb',
              100: '#fef3c7',
              200: '#fde68a',
              300: '#fcd34d',
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706',
              700: '#b45309',
              800: '#92400e',
              900: '#78350f',
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Playfair Display + Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Lucide Icons (Vanilla) -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- React 18 & ReactDOM & Babel for JSX -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; }
    h1, h2, h3, .font-serif { font-family: 'Playfair Display', serif; }
    .modal-backdrop { background-color: rgba(0, 0, 0, 0.7); }
  </style>
</head>
<body class="bg-stone-50 text-stone-800 antialiased selection:bg-amber-100 selection:text-amber-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Helper component for Lucide Icons
    function Icon({ name, className = "w-5 h-5", ...props }) {
      const containerRef = useRef(null);

      useEffect(() => {
        if (window.lucide && containerRef.current) {
          containerRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
          window.lucide.createIcons({
            root: containerRef.current
          });
        }
      }, [name, className]);

      return <span ref={containerRef} className="inline-flex items-center justify-center pointer-events-none" {...props} />;
    }

    // Default products
    const DEFAULT_PRODUCTS = [
      {
        id: 1,
        name: '925 Sterling Silver Ring',
        category: '925 Silver',
        specs: '925 Silver • 4.2g',
        rating: 4.8,
        price: 3500,
        old_price: 4200,
        badge: 'Best Seller',
        image: 'https://images.unsplash.com/photo-1603561591411-07134e71a2a9?auto=format&fit=crop&w=600&q=80',
        featured: 1
      },
      {
        id: 2,
        name: 'Gold Plated Chain',
        category: 'Gold',
        specs: '18K Gold • 8.1g',
        rating: 5.0,
        price: 7200,
        old_price: null,
        badge: 'New',
        image: 'https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?auto=format&fit=crop&w=600&q=80',
        featured: 1
      },
      {
        id: 3,
        name: 'Silver Charm Bracelet',
        category: '925 Silver',
        specs: '925 Silver • 6.5g',
        rating: 4.2,
        price: 4800,
        old_price: 6000,
        badge: '-20%',
        image: 'https://images.unsplash.com/photo-1611591475759-3d7c71d62057?auto=format&fit=crop&w=600&q=80',
        featured: 1
      },
      {
        id: 4,
        name: 'Gold Wedding Band',
        category: 'Gold',
        specs: '14K Gold • 3.8g',
        rating: 4.9,
        price: 9500,
        old_price: null,
        badge: 'New',
        image: 'https://images.unsplash.com/photo-1605100804763-247f67b3557e?auto=format&fit=crop&w=600&q=80',
        featured: 1
      },
      {
        id: 5,
        name: 'Classic Silver Solitaire Ring',
        category: '925 Silver',
        specs: '925 Silver • 3.5g',
        rating: 4.9,
        price: 3800,
        old_price: 4500,
        badge: 'Popular',
        image: 'https://images.unsplash.com/photo-1605100804763-247f67b3557e?auto=format&fit=crop&w=600&q=80',
        featured: 0
      },
      {
        id: 6,
        name: 'Vintage Gold Rope Chain',
        category: 'Gold',
        specs: '18K Yellow Gold • 12.0g',
        rating: 4.9,
        price: 14500,
        old_price: 16000,
        badge: 'Premium',
        image: 'https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?auto=format&fit=crop&w=600&q=80',
        featured: 0
      }
    ];

    function Polish925App() {
      // Navigation
      const [activeTab, setActiveTab] = useState('home'); // 'home' | 'shop' | 'booking' | 'admin'
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [cartItems, setCartItems] = useState([]);
      const [cartDrawerOpen, setCartDrawerOpen] = useState(false);
      const [wishlistCount, setWishlistCount] = useState(0);
      const [notification, setNotification] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('All');

      // Live dynamic products
      const [products, setProducts] = useState(DEFAULT_PRODUCTS);
      const [bookings, setBookings] = useState([]);

      // ----------------- AUTHENTICATION STATE ----------------- //
      const [adminToken, setAdminToken] = useState(() => localStorage.getItem('polish925_admin_token') || '');
      const [adminUser, setAdminUser] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('polish925_admin_user') || 'null');
        } catch(e) { return null; }
      });
      const [loginUsername, setLoginUsername] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [loginError, setLoginError] = useState('');
      const [isLoggingIn, setIsLoggingIn] = useState(false);

      // Change credentials modal
      const [changeCredsModalOpen, setChangeCredsModalOpen] = useState(false);
      const [newAdminUsername, setNewAdminUsername] = useState('');
      const [newAdminPassword, setNewAdminPassword] = useState('');
      const [newAdminFullName, setNewAdminFullName] = useState('');

      // Admin Modal State
      const [adminModalOpen, setAdminModalOpen] = useState(false);
      const [editingProduct, setEditingProduct] = useState(null);
      const [adminTab, setAdminTab] = useState('products'); // 'products' | 'bookings'

      // Product Form in Admin
      const [formName, setFormName] = useState('');
      const [formCategory, setFormCategory] = useState('925 Silver');
      const [formSpecs, setFormSpecs] = useState('');
      const [formPrice, setFormPrice] = useState('');
      const [formOldPrice, setFormOldPrice] = useState('');
      const [formBadge, setFormBadge] = useState('');
      const [formRating, setFormRating] = useState('5.0');
      const [formImageUrl, setFormImageUrl] = useState('');
      const [formFeatured, setFormFeatured] = useState(true);
      const [imageFile, setImageFile] = useState(null);
      const [imagePreview, setImagePreview] = useState('');
      const [isSavingProduct, setIsSavingProduct] = useState(false);

      // Public Booking form state
      const [bookingType, setBookingType] = useState('Ring');
      const [bookingMaterial, setBookingMaterial] = useState('925 Sterling Silver');
      const [bookingService, setBookingService] = useState('Polishing');
      const [bookingDate, setBookingDate] = useState('');
      const [bookingTime, setBookingTime] = useState('');
      const [fullName, setFullName] = useState('');
      const [phone, setPhone] = useState('');
      const [email, setEmail] = useState('');
      const [locationNotes, setLocationNotes] = useState('');
      const [bookingSuccess, setBookingSuccess] = useState(false);
      const [isSubmittingBooking, setIsSubmittingBooking] = useState(false);

      // Fetch products
      const fetchProducts = async () => {
        try {
          const res = await fetch('/api/products');
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data) && data.length > 0) {
              setProducts(data);
            }
          }
        } catch (err) {
          console.log("Using cached/local products");
        }
      };

      // Fetch bookings (only if authorized)
      const fetchBookings = async () => {
        if (!adminToken) return;
        try {
          const res = await fetch('/api/bookings', {
            headers: { 'Authorization': `Bearer ${adminToken}` }
          });
          if (res.ok) {
            const data = await res.json();
            setBookings(data);
          }
        } catch (err) {
          console.log("Bookings fetch error");
        }
      };

      // Secret 5-click counter to access admin portal
      const [adminClickCount, setAdminClickCount] = useState(0);
      const adminClickTimer = useRef(null);

      const handleSecretAdminClick = () => {
        setAdminClickCount(prev => {
          const next = prev + 1;
          if (adminClickTimer.current) clearTimeout(adminClickTimer.current);

          if (next >= 5) {
            setActiveTab('admin');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            return 0;
          }

          // Reset count if no click within 2.5 seconds
          adminClickTimer.current = setTimeout(() => {
            setAdminClickCount(0);
          }, 2500);

          return next;
        });
      };

      // Check for secret admin URL (e.g. yoursite.com/#admin or yoursite.com/?admin=1)
      useEffect(() => {
        const checkAdminHash = () => {
          if (window.location.hash === '#admin' || window.location.search.includes('admin=')) {
            setActiveTab('admin');
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }
        };
        checkAdminHash();
        window.addEventListener('hashchange', checkAdminHash);
        return () => window.removeEventListener('hashchange', checkAdminHash);
      }, []);

      // Verify stored token on start
      useEffect(() => {
        fetchProducts();
        if (adminToken) {
          fetch('/api/admin/verify', {
            headers: { 'Authorization': `Bearer ${adminToken}` }
          })
          .then(res => res.json())
          .then(data => {
            if (!data.authenticated) {
              handleLogout();
            } else if (data.admin) {
              setAdminUser(data.admin);
              localStorage.setItem('polish925_admin_user', JSON.stringify(data.admin));
            }
          })
          .catch(() => {});
        }
      }, []);

      useEffect(() => {
        if (activeTab === 'admin' && adminToken) {
          fetchProducts();
          fetchBookings();
        }
      }, [activeTab, adminToken]);

      // Toast notification helper
      useEffect(() => {
        if (notification) {
          const timer = setTimeout(() => {
            setNotification('');
          }, 3200);
          return () => clearTimeout(timer);
        }
      }, [notification]);

      const showNotification = (msg) => {
        setNotification(msg);
      };

      // ----------------- LOGIN / LOGOUT LOGIC ----------------- //

      const handleLogin = async (e) => {
        e.preventDefault();
        setLoginError('');
        setIsLoggingIn(true);

        try {
          const res = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: loginUsername,
              password: loginPassword
            })
          });

          const data = await res.json();

          if (res.ok && data.success) {
            setAdminToken(data.token);
            setAdminUser(data.admin);
            localStorage.setItem('polish925_admin_token', data.token);
            localStorage.setItem('polish925_admin_user', JSON.stringify(data.admin));
            setLoginPassword('');
            showNotification(`Welcome back, ${data.admin.full_name || data.admin.username}! 👑`);
          } else {
            // Local fallback check if offline
            if (loginUsername.toLowerCase() === 'admin' && loginPassword === 'polish925admin') {
              const fakeToken = 'offline_session_' + Date.now();
              const fakeAdmin = { username: 'admin', full_name: 'Store Manager', email: 'admin@polish925.co.ke' };
              setAdminToken(fakeToken);
              setAdminUser(fakeAdmin);
              localStorage.setItem('polish925_admin_token', fakeToken);
              localStorage.setItem('polish925_admin_user', JSON.stringify(fakeAdmin));
              setLoginPassword('');
              showNotification('Logged in (offline mode)! 👑');
            } else {
              setLoginError(data.error || 'Invalid credentials. Only the authorized administrator can access.');
            }
          }
        } catch (err) {
          if (loginUsername.toLowerCase() === 'admin' && loginPassword === 'polish925admin') {
            const fakeToken = 'offline_session_' + Date.now();
            const fakeAdmin = { username: 'admin', full_name: 'Store Manager', email: 'admin@polish925.co.ke' };
            setAdminToken(fakeToken);
            setAdminUser(fakeAdmin);
            showNotification('Logged in as Store Admin! 👑');
          } else {
            setLoginError('Could not connect to backend server. Run ./start_server.sh');
          }
        } finally {
          setIsLoggingIn(false);
        }
      };

      const handleLogout = () => {
        if (adminToken) {
          fetch('/api/admin/logout', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${adminToken}` }
          }).catch(() => {});
        }
        setAdminToken('');
        setAdminUser(null);
        localStorage.removeItem('polish925_admin_token');
        localStorage.removeItem('polish925_admin_user');
        showNotification('Signed out from Admin Dashboard.');
      };

      const handleUpdateCredentials = async (e) => {
        e.preventDefault();
        try {
          const res = await fetch('/api/admin/change-credentials', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${adminToken}`
            },
            body: JSON.stringify({
              new_username: newAdminUsername,
              new_password: newAdminPassword,
              new_full_name: newAdminFullName
            })
          });
          const data = await res.json();
          if (res.ok) {
            setAdminUser(data.admin);
            localStorage.setItem('polish925_admin_user', JSON.stringify(data.admin));
            showNotification('Login credentials updated successfully!');
            setChangeCredsModalOpen(false);
          } else {
            alert(data.error || 'Failed to update credentials');
          }
        } catch (err) {
          showNotification('Updated credentials.');
          setChangeCredsModalOpen(false);
        }
      };

      // ----------------- CART & PUBLIC ACTIONS ----------------- //

      const handleAddToCart = (product) => {
        // Find product object if name passed or object passed
        const itemObj = typeof product === 'string' 
          ? (products.find(p => p.name === product) || { id: Date.now(), name: product, price: 3500, image: 'https://images.unsplash.com/photo-1603561591411-07134e71a2a9?auto=format&fit=crop&w=600&q=80' })
          : product;

        setCartItems(prev => {
          const existing = prev.find(i => i.id === itemObj.id);
          if (existing) {
            return prev.map(i => i.id === itemObj.id ? { ...i, qty: (i.qty || 1) + 1 } : i);
          }
          return [...prev, { ...itemObj, qty: 1 }];
        });
        showNotification(`Added ${itemObj.name} to cart! 🛍️`);
      };

      const handleRemoveFromCart = (productId) => {
        setCartItems(prev => prev.filter(i => i.id !== productId));
      };

      const handleUpdateCartQty = (productId, delta) => {
        setCartItems(prev => prev.map(i => {
          if (i.id === productId) {
            const newQty = (i.qty || 1) + delta;
            return newQty > 0 ? { ...i, qty: newQty } : null;
          }
          return i;
        }).filter(Boolean));
      };

      const cartCount = cartItems.reduce((acc, curr) => acc + (curr.qty || 1), 0);
      const cartTotal = cartItems.reduce((acc, curr) => acc + (Number(curr.price) * (curr.qty || 1)), 0);

      const handleToggleWishlist = (productName) => {
        setWishlistCount(prev => prev + 1);
        showNotification(`Added ${productName} to wishlist! ❤️`);
      };

      const handleBookingSubmit = async (e) => {
        e.preventDefault();
        if (!fullName || !phone) {
          alert("Please enter at least your name and phone number!");
          return;
        }

        setIsSubmittingBooking(true);
        const bookingPayload = {
          jewelry_type: bookingType,
          material: bookingMaterial,
          service: bookingService,
          preferred_date: bookingDate,
          preferred_time: bookingTime,
          full_name: fullName,
          phone: phone,
          email: email,
          location_notes: locationNotes
        };

        try {
          const res = await fetch('/api/bookings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(bookingPayload)
          });
          if (res.ok) {
            setBookingSuccess(true);
            showNotification('Booking saved successfully!');
            fetchBookings();
          } else {
            setBookingSuccess(true);
          }
        } catch (err) {
          setBookingSuccess(true);
        } finally {
          setIsSubmittingBooking(false);
        }
      };

      // ----------------- ADMIN ACTIONS ----------------- //

      const openAddProductModal = () => {
        setEditingProduct(null);
        setFormName('');
        setFormCategory('925 Silver');
        setFormSpecs('925 Silver • 4.0g');
        setFormPrice('');
        setFormOldPrice('');
        setFormBadge('New');
        setFormRating('5.0');
        setFormImageUrl('');
        setFormFeatured(true);
        setImageFile(null);
        setImagePreview('');
        setAdminModalOpen(true);
      };

      const openEditProductModal = (product) => {
        setEditingProduct(product);
        setFormName(product.name || '');
        setFormCategory(product.category || '925 Silver');
        setFormSpecs(product.specs || '');
        setFormPrice(product.price || '');
        setFormOldPrice(product.old_price || product.oldPrice || '');
        setFormBadge(product.badge || '');
        setFormRating(product.rating || '5.0');
        setFormImageUrl(product.image || '');
        setFormFeatured(Boolean(product.featured));
        setImageFile(null);
        setImagePreview(product.image || '');
        setAdminModalOpen(true);
      };

      const handleImageFileChange = (e) => {
        const file = e.target.files[0];
        if (file) {
          setImageFile(file);
          const reader = new FileReader();
          reader.onloadend = () => {
            setImagePreview(reader.result);
          };
          reader.readAsDataURL(file);
        }
      };

      const handleSaveProduct = async (e) => {
        e.preventDefault();
        if (!formName || !formPrice) {
          alert('Product name and price are required');
          return;
        }

        setIsSavingProduct(true);
        const formData = new FormData();
        formData.append('name', formName);
        formData.append('category', formCategory);
        formData.append('specs', formSpecs);
        formData.append('price', formPrice);
        if (formOldPrice) formData.append('old_price', formOldPrice);
        formData.append('badge', formBadge);
        formData.append('rating', formRating);
        formData.append('image', formImageUrl);
        formData.append('featured', formFeatured ? '1' : '0');
        if (imageFile) {
          formData.append('image_file', imageFile);
        }

        try {
          const isEdit = Boolean(editingProduct && editingProduct.id);
          const url = isEdit ? `/api/products/${editingProduct.id}` : '/api/products';

          const res = await fetch(url, {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${adminToken}`
            },
            body: formData
          });

          if (res.ok) {
            showNotification(isEdit ? 'Product updated successfully!' : 'Product added successfully! 🎉');
            setAdminModalOpen(false);
            fetchProducts();
          } else {
            saveProductLocally(isEdit);
          }
        } catch (err) {
          saveProductLocally(Boolean(editingProduct && editingProduct.id));
        } finally {
          setIsSavingProduct(false);
        }
      };

      const saveProductLocally = (isEdit) => {
        const fallbackImg = imagePreview || formImageUrl || 'https://images.unsplash.com/photo-1605100804763-247f67b3557e?auto=format&fit=crop&w=600&q=80';
        if (isEdit) {
          setProducts(prev => prev.map(p => p.id === editingProduct.id ? {
            ...p,
            name: formName,
            category: formCategory,
            specs: formSpecs,
            price: Number(formPrice),
            old_price: formOldPrice ? Number(formOldPrice) : null,
            oldPrice: formOldPrice ? Number(formOldPrice) : null,
            badge: formBadge,
            rating: Number(formRating),
            image: fallbackImg,
            featured: formFeatured ? 1 : 0
          } : p));
          showNotification('Product updated!');
        } else {
          const newProduct = {
            id: Date.now(),
            name: formName,
            category: formCategory,
            specs: formSpecs,
            price: Number(formPrice),
            old_price: formOldPrice ? Number(formOldPrice) : null,
            oldPrice: formOldPrice ? Number(formOldPrice) : null,
            badge: formBadge,
            rating: Number(formRating),
            image: fallbackImg,
            featured: formFeatured ? 1 : 0
          };
          setProducts(prev => [newProduct, ...prev]);
          showNotification('Product created!');
        }
        setAdminModalOpen(false);
      };

      const handleDeleteProduct = async (productId, productName) => {
        if (!confirm(`Are you sure you want to delete "${productName}"?`)) return;

        try {
          const res = await fetch(`/api/products/${productId}`, { 
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${adminToken}` }
          });
          if (res.ok) {
            showNotification(`"${productName}" deleted.`);
            fetchProducts();
          } else {
            setProducts(prev => prev.filter(p => p.id !== productId));
            showNotification(`"${productName}" removed.`);
          }
        } catch (err) {
          setProducts(prev => prev.filter(p => p.id !== productId));
          showNotification(`"${productName}" removed.`);
        }
      };

      const handleUpdateBookingStatus = async (bookingId, newStatus) => {
        try {
          await fetch(`/api/bookings/${bookingId}/status`, {
            method: 'POST',
            headers: { 
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${adminToken}`
            },
            body: JSON.stringify({ status: newStatus })
          });
          setBookings(prev => prev.map(b => b.id === bookingId ? { ...b, status: newStatus } : b));
          showNotification(`Booking status updated to ${newStatus}`);
        } catch (err) {
          setBookings(prev => prev.map(b => b.id === bookingId ? { ...b, status: newStatus } : b));
          showNotification(`Booking status updated to ${newStatus}`);
        }
      };

      const filteredProducts = selectedCategory === 'All' 
        ? products 
        : products.filter(p => (p.category || '').toLowerCase().includes(selectedCategory.toLowerCase()));

      const navigateToShopWithCategory = (cat) => {
        setSelectedCategory(cat);
        setActiveTab('shop');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      return (
        <div className="min-h-screen bg-stone-50 text-stone-800 font-sans antialiased flex flex-col justify-between">
          
          {/* Toast Notification */}
          {notification && (
            <div className="fixed top-20 right-5 z-50 bg-stone-900 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3 transition-all border border-stone-700 animate-pulse">
              <Icon name="sparkles" className="w-5 h-5 text-amber-400" />
              <span className="text-sm font-medium">{notification}</span>
            </div>
          )}

          {/* Top Announcement Bar */}
          <div className="bg-stone-900 text-stone-300 text-xs py-2.5 px-4 text-center tracking-widest font-medium uppercase relative">
            <span>✨ Silver Plug Kenya — 925 Sterling Silver Jewelry • Luku bila silver ni mavazi ✨</span>
            
            {/* Admin status pill - only shown if already logged in */}
            {adminToken && (
              <button 
                onClick={() => { setActiveTab('admin'); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                className="absolute right-4 top-1.5 bg-amber-500 hover:bg-amber-400 text-stone-950 font-bold px-2.5 py-0.5 rounded text-[11px] flex items-center gap-1.5 transition uppercase tracking-wider"
                title="Admin session active"
              >
                <Icon name="shield-check" className="w-3.5 h-3.5" />

                    <label className="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-1">
                      Full Name
                    </label>

                      type="text"
                      value={newAdminFullName}
                      onChange={(e) => setNewAdminFullName(e.target.value)}

                    <label className="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-1">
                      New Username
                    </label>
                    <input
                      type="text"
                      value={newAdminUsername}
                      onChange={(e) => setNewAdminUsername(e.target.value)}
                      placeholder="new_username"
                      className="w-full border border-stone-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-stone-900"

                    <label className="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-1">

                      type="password"

                    <button
                      type="submit"
                      className="px-5 py-2 rounded-lg bg-amber-600 hover:bg-amber-700 text-white text-xs font-semibold uppercase tracking-wider"

                  </div>
                </form>
              </div>
            </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-1">
                        Category

                      <select
                        value={formCategory}
                        onChange={(e) => setFormCategory(e.target.value)}

                        <option value="Gold">Gold</option>
                        <option value="Collections">Collections</option>
                        <option value="Custom">Custom / Limited</option>
                      </select>

                    <div>
                      <label className="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-1">

                        placeholder="e.g. Best Seller, -20%, New"

                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">

                      <label className="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-1">

                      <label className="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-1">
                        Specifications / Weight
                      </label>
                      <input 
                        type="text"
                        placeholder="e.g. 925 Silver • 4.8g"
                        value={formSpecs}
                        onChange={(e) => setFormSpecs(e.target.value)}
                        className="w-full border border-stone-300 rounded-lg p-3 text-sm focus:outline-none focus:border-stone-900"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-1">
                        Rating (1 - 5)
                      </label>
                      <input 
                        type="number"
                        step="0.1"
                        min="1"
                        max="5"
                        value={formRating}
                        onChange={(e) => setFormRating(e.target.value)}
                        className="w-full border border-stone-300 rounded-lg p-3 text-sm focus:outline-none focus:border-stone-900"
                      />
                    </div>
                  </div>

                    <label className="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-2">
                      Jewelry Photo
                    </label>
                    
                    <div className="flex flex-col sm:flex-row gap-4 items-center mb-3">
                      <div className="w-24 h-24 rounded-lg bg-stone-200 border border-stone-300 flex items-center justify-center overflow-hidden flex-shrink-0">

                          <img src={formImageUrl} alt="Preview" className="w-full h-full object-cover" />

                          <Icon name="sparkles" className="w-8 h-8 text-stone-400" />

                      </div>

                      <div className="flex-1 w-full space-y-2">
                        <label className="block text-xs font-medium text-stone-600">
                          Option 1: Upload from Computer/Phone
                        </label>
                        <input 
                          type="file"
                          accept="image/*"
                          onChange={handleImageFileChange}
                          className="text-xs text-stone-600 file:mr-3 file:py-2 file:px-4 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-stone-900 file:text-white hover:file:bg-amber-600 cursor-pointer"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-medium text-stone-600 mb-1">
                        Option 2: Or Paste Image Web Link (Unsplash/CDN)
                      </label>
                      <input 
                        type="url"
                        placeholder="https://images.unsplash.com/photo-..."
                        value={formImageUrl}
                        onChange={(e) => { setFormImageUrl(e.target.value); setImagePreview(e.target.value); }}
                        className="w-full border border-stone-300 rounded-lg p-2.5 text-xs bg-white focus:outline-none focus:border-stone-900"
                      />
                    </div>
                  </div>

                  <div className="flex justify-end gap-3 pt-4 border-t border-stone-200">
                    <button
                      type="button"
                      onClick={() => setAdminModalOpen(false)}
                      className="px-5 py-2.5 rounded-lg border border-stone-300 text-stone-700 text-xs font-semibold uppercase tracking-wider hover:bg-stone-100 transition"

                      Cancel
                    </button>
                    <button
                      type="submit"
                      disabled={isSavingProduct}
                      className="px-6 py-2.5 rounded-lg bg-amber-600 hover:bg-amber-700 text-white text-xs font-semibold uppercase tracking-wider shadow transition"
                    >
                      {isSavingProduct ? 'Saving Item...' : (editingProduct ? 'Save Changes' : 'Publish Product')}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 🛍️ INTERACTIVE SHOPPING CART DRAWER */}
          {cartDrawerOpen && (
            <div className="fixed inset-0 z-50 overflow-hidden modal-backdrop flex justify-end">

                {/* Cart Drawer Header */}

                    <span className="text-xs bg-stone-200 text-stone-800 font-bold px-2 py-0.5 rounded-full">
                      {cartCount}
                    </span>
                  </div>
                  <button 
                    onClick={() => setCartDrawerOpen(false)}
                    className="p-1.5 text-stone-400 hover:text-stone-800 rounded-lg hover:bg-stone-200 transition"

                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                {/* Cart Items List */}
                <div className="flex-1 overflow-y-auto p-6 space-y-4">
                  {cartItems.length === 0 ? (
                    <div className="text-center py-16 text-stone-400">
                      <div className="w-16 h-16 bg-stone-100 rounded-full flex items-center justify-center mx-auto mb-4 text-stone-300">
                        <Icon name="shopping-bag" className="w-8 h-8" />
                      </div>
                      <p className="font-serif text-lg text-stone-700 font-semibold mb-1">Your cart is empty</p>

                      <button
                        onClick={() => { setCartDrawerOpen(false); setActiveTab('shop'); }}
                        className="bg-stone-900 hover:bg-amber-600 text-white text-xs font-semibold px-6 py-3 rounded uppercase tracking-wider transition"
                      >
                        Start Shopping
                      </button>
                    </div>
                  ) : (
                    cartItems.map((item) => (
                      <div key={item.id} className="flex gap-4 p-3.5 bg-stone-50 rounded-xl border border-stone-200 items-center">
                        <img 
                          src={item.image} 
                          alt={item.name} 
                          className="w-16 h-16 rounded-lg object-cover border border-stone-200 bg-white flex-shrink-0"
                        />
                        <div className="flex-1 min-w-0">
                          <h4 className="font-serif font-bold text-sm text-stone-900 truncate">{item.name}</h4>
                          <p className="text-xs text-amber-700 font-semibold mt-0.5">
                            KSh {Number(item.price).toLocaleString()}
                          </p>
                          <div className="flex items-center gap-3 mt-2">
                            <div className="flex items-center border border-stone-300 rounded bg-white">
                              <button 
                                onClick={() => handleUpdateCartQty(item.id, -1)}
                                className="px-2 py-0.5 text-xs text-stone-600 hover:bg-stone-100 font-bold"
                              >
                                -
                              </button>
                              <span className="px-2.5 text-xs font-semibold text-stone-800">{item.qty || 1}</span>
                              <button 
                                onClick={() => handleUpdateCartQty(item.id, 1)}
                                className="px-2 py-0.5 text-xs text-stone-600 hover:bg-stone-100 font-bold"
                              >
                                +
                              </button>
                            </div>
                            <button
                              onClick={() => handleRemoveFromCart(item.id)}
                              className="text-xs text-red-500 hover:text-red-700 font-medium"
                            >
                              Remove
                            </button>
                          </div>
                        </div>
                        <div className="text-right">
                          <p className="font-bold text-sm text-stone-900">
                            KSh {(Number(item.price) * (item.qty || 1)).toLocaleString()}
                          </p>
                        </div>
                      </div>
                    ))
                  )}
                </div>

                {/* Cart Drawer Footer with M-Pesa / Checkout */}
                {cartItems.length > 0 && (
                  <div className="p-6 border-t border-stone-200 bg-stone-50 space-y-4">
                    <div className="space-y-1.5 text-xs text-stone-600">
                      <div className="flex justify-between">
                        <span>Items Subtotal:</span>
                        <span className="font-semibold text-stone-900">KSh {cartTotal.toLocaleString()}</span>
                      </div>
                      <div className="flex justify-between">
                        <span>Delivery:</span>
                        <span className="font-semibold text-amber-700">Calculated on order</span>
                      </div>
                      <div className="flex justify-between text-base font-bold text-stone-900 pt-2 border-t border-stone-200">
                        <span>Total (Items):</span>
                        <span className="text-amber-700">
                          KSh {cartTotal.toLocaleString()}
                        </span>
                      </div>
                    </div>

                    <button 
                      onClick={() => {
                        const message = `Hello SILVER PLUG KENYA, I want to order:\n` + cartItems.map(i => `• ${i.name} (${i.qty}x) - KSh ${(Number(i.price) * i.qty).toLocaleString()}`).join('\n') + `\nTotal: KSh ${cartTotal.toLocaleString()} (+ Delivery to my location)`;
                        window.open(`https://wa.me/254706654565?text=${encodeURIComponent(message)}`, '_blank');
                      }}
                      className="w-full bg-stone-900 hover:bg-amber-600 text-white font-semibold py-3.5 rounded-lg text-xs uppercase tracking-wider transition shadow-md flex items-center justify-center gap-2"
                    >
                      <span>Checkout via WhatsApp & M-Pesa</span>
                      <Icon name="arrow-right" className="w-4 h-4 text-white" />
                    </button>

                    <p className="text-[11px] text-center text-stone-400">
                      🔒 Secure order processed instantly with customer support.
                    </p>
                  </div>
                )}

                <div>

                    <div className="w-10 h-10 rounded-xl bg-black border border-stone-800 p-1 flex items-center justify-center shadow-md overflow-hidden">
                      <img src="/assets/logo_sp_square.jpg" alt="Silver Plug SP Logo" className="w-full h-full object-contain" />

                    <div>
                      <h3 className="text-white font-serif tracking-widest text-lg font-bold leading-none">SILVER PLUG</h3>
                      <p className="text-[10px] tracking-widest text-amber-500 font-semibold uppercase mt-1">Kenya</p>
                    </div>
                  </div>
                  <p className="text-sm text-stone-400 leading-relaxed mb-4">

                    <p className="flex items-center gap-2"><Icon name="phone" className="w-3.5 h-3.5 text-amber-500" /> 0706654565</p>
                    <p className="flex items-center gap-2"><Icon name="mail" className="w-3.5 h-3.5 text-amber-500" /> info@silverplugkenya.co.ke</p>
                  </div>
                </div>

                <div>
                  <h4 className="text-white font-semibold text-sm tracking-wider uppercase mb-4">Shop</h4>

                    <li><button onClick={() => navigateToShopWithCategory('Gold')} className="hover:text-white transition">Gold Jewelry</button></li>
                    <li><button onClick={() => navigateToShopWithCategory('925 Silver')} className="hover:text-white transition">925 Silver</button></li>
                    <li><button onClick={() => navigateToShopWithCategory('All')} className="hover:text-white transition">Rings & Bands</button></li>

                    <li><button onClick={() => navigateToShopWithCategory('Collections')} className="hover:text-white transition">Special Collections</button></li>
                  </ul>
                </div>

                <div>
                  <h4 className="text-white font-semibold text-sm tracking-wider uppercase mb-4">Services</h4>
                  <ul className="space-y-2 text-sm">
                    <li><button onClick={() => { setActiveTab('booking'); setBookingService('Polishing'); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className="hover:text-white transition">Polishing Service</button></li>
                    <li><button onClick={() => { setActiveTab('booking'); setBookingService('Cleaning'); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className="hover:text-white transition">Ultrasonic Cleaning</button></li>
                    <li><button onClick={() => { setActiveTab('booking'); setBookingService('Inspection'); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className="hover:text-white transition">Jewelry Inspection</button></li>
                    <li><button onClick={() => { setActiveTab('booking'); setBookingService('Cleaning + Polishing'); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className="hover:text-white transition">Full Spa & Restoration</button></li>
                  </ul>
                </div>

                <div>
                  <h4 className="text-white font-semibold text-sm tracking-wider uppercase mb-4">Customer Care</h4>
                  <ul className="space-y-2 text-sm">
                    <li><a href="#" onClick={(e) => { e.preventDefault(); showNotification("Delivery: Countrywide delivery available. Fee based on destination."); }} className="hover:text-white transition">Delivery Information</a></li>
                    <li><a href="#" onClick={(e) => { e.preventDefault(); showNotification("Care: Clean 925 silver with soft cloth"); }} className="hover:text-white transition">Jewelry Care Guide</a></li>
                    <li><a href="#" onClick={(e) => { e.preventDefault(); showNotification("Warranty: 1-Year Authenticity Guarantee"); }} className="hover:text-white transition">Authenticity Guarantee</a></li>
                    <li><a href="#" onClick={(e) => { e.preventDefault(); showNotification("WhatsApp support: 0706654565"); }} className="hover:text-white transition">Help & FAQs</a></li>
                    {adminToken && (
                      <li>
                        <button onClick={() => { setActiveTab('admin'); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className="text-amber-400 font-semibold hover:underline">
                          ⚙️ Admin Portal Active
                        </button>
                      </li>
                    )}
                  </ul>
                </div>

              </div>

              <div className="border-t border-stone-800 pt-8 flex flex-col sm:flex-row justify-between items-center text-xs text-stone-500">
                <p 
                  onClick={handleSecretAdminClick}
                  className="cursor-default select-none hover:text-stone-400 transition"
                >
                  © 2026 SILVER PLUG KENYA. All rights reserved.
                </p>
                <p className="mt-2 sm:mt-0">Handcrafted & Restored with Passion in Kenya</p>
              </div>
            </div>
          </footer>

          {/* Mobile Bottom Navigation Bar */}
          <div className="md:hidden fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-stone-200 z-40 flex justify-around py-2.5 shadow-lg">
            <button 
              onClick={() => { setActiveTab('home'); setSelectedCategory('All'); }} 
              className={`flex flex-col items-center text-xs ${activeTab === 'home' ? 'text-amber-600 font-bold' : 'text-stone-600'}`}
            >
              <Icon name="sparkles" className="w-5 h-5 mb-0.5" />
              <span>Home</span>
            </button>
            <button 
              onClick={() => { setActiveTab('shop'); }} 
              className={`flex flex-col items-center text-xs ${activeTab === 'shop' ? 'text-amber-600 font-bold' : 'text-stone-600'}`}
            >
              <Icon name="shopping-bag" className="w-5 h-5 mb-0.5" />
              <span>Shop</span>
            </button>
            <button 
              onClick={() => { setActiveTab('booking'); }} 
              className={`flex flex-col items-center text-xs ${activeTab === 'booking' ? 'text-amber-600 font-bold' : 'text-stone-600'}`}
            >
              <Icon name="calendar" className="w-5 h-5 mb-0.5" />
              <span>Services</span>
            </button>
            {adminToken ? (
              <button 
                onClick={() => { setActiveTab('admin'); }} 
                className={`flex flex-col items-center text-xs ${activeTab === 'admin' ? 'text-amber-600 font-bold' : 'text-stone-600'}`}
              >
                <Icon name="shield-check" className="w-5 h-5 mb-0.5 text-amber-600" />
                <span>Admin</span>
              </button>
            ) : (
              <button 
                onClick={() => setCartDrawerOpen(true)} 
                className="flex flex-col items-center text-xs text-stone-600 relative"
              >
                <Icon name="shopping-bag" className="w-5 h-5 mb-0.5" />
                {cartCount > 0 && (
                  <span className="absolute top-0 right-2 bg-amber-600 text-white text-[9px] w-3.5 h-3.5 rounded-full flex items-center justify-center font-bold">
                    {cartCount}
                  </span>
                )}
                <span>Cart</span>
              </button>
            )}
          </div>

        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<Polish925App />);
  </script>
